name: Release (publish to npm)

# Cut a release by tagging a commit on main that is already green on CI (see
# RELEASING.md). On a vX.Y.Z tag this re-runs the publish-critical gates (unit +
# headless Worker/WASM + bundler) and, only if they pass, publishes to npm with
# build provenance. Requires the NPM_TOKEN repository secret (an npm automation
# token). The job never publishes if any gate fails or the tag/version disagree.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for `npm publish --provenance`

jobs:
  publish:
    name: Test gates + npm publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      - name: Install (locked)
        run: npm ci
      - name: Tag must match package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json ($PKG_VERSION)"
            exit 1
          fi
      - name: Unit tests + real-WASM recovery tests
        run: |
          npm test
          node tests/wasm/hyperbolic_recovery.mjs
          node tests/wasm/weber_recovery.mjs
          node tests/wasm/likelihood_parity.mjs
      - name: Browser end-to-end (Worker/WASM)
        run: npm run test:browser
      - name: Bundler build (npm pack -> Vite build -> headless WASM)
        run: npm run test:bundler
      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
