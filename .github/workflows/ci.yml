name: CI

# Runs on PRs and on pushes to main. The unit job needs no dependencies; the
# browser job installs puppeteer (which brings its own Chromium) to exercise the
# Web Worker + WASM path that the node tests deliberately bypass.
on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default for all jobs; none of them write to the repo.
permissions:
  contents: read

jobs:
  unit:
    name: Unit tests + Stan recovery test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Exercise the engines floor (>=20) and the current LTS-ish latest.
        node: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests (MI engine, model adapter, facade)
        run: node --test tests/js/*.test.mjs
      - name: Stan recovery test - hyperbolic (real WASM via fetch shim)
        run: node tests/wasm/hyperbolic_recovery.mjs
      - name: Stan recovery test - weber dots (real WASM via fetch shim)
        run: node tests/wasm/weber_recovery.mjs
      - name: locateFile runtime test (emscripten honors the #57 glue patch)
        run: node tests/wasm/locate_file.mjs
      - name: Adaptive-stopping recovery test (real WASM EIG stopping, #21)
        run: node tests/wasm/stopping_recovery.mjs
      - name: Recovery test - 3-param categorical line-length (real WASM, #87)
        run: node tests/wasm/line_length_3ifc_recovery.mjs
      - name: Recovery test - exponential discounting (real WASM, demo model)
        run: node tests/wasm/exponential_recovery.mjs
      - name: Recovery test - magnitude estimation (continuous, real WASM, #114)
        run: node tests/wasm/magnitude_estimation_recovery.mjs
      - name: Likelihood parity test (JS responseProb == compiled Stan, all models)
        run: node tests/wasm/likelihood_parity.mjs

  static:
    name: Format + type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dev deps (prettier + typescript)
        run: npm ci
      - name: Check formatting (prettier --check .)
        run: npm run format:check
      - name: Type-check public declarations (tsc --noEmit)
        run: npm run typecheck

  browser:
    name: Browser end-to-end (Worker/WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dev deps (puppeteer + Chromium)
        run: npm ci
      - name: Headless browser tests (delay discounting + line length)
        run: npm run test:browser

  bundler:
    name: Bundler build (npm pack -> Vite build -> headless WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dev deps (puppeteer + Chromium)
        run: npm ci
      # Packs the library, installs the tarball into tests/bundler/fixture, runs a
      # real Vite production build, and headlessly confirms the hashed WASM loads
      # through the public API — the only check that exercises the #57 fix under a
      # real bundler (node tests bypass the Worker; browser tests serve raw source).
      - name: Bundler consumer build (Vite + hashed WASM)
        run: npm run test:bundler
